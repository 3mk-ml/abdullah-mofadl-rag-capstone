name: Cancel all runs except RAGAS 18

on:
  push:
    paths:
      - ".github/workflows/cancel-others.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RUN_ID: "36803926630"
      STALE_RUN_ID: "36803193998"
      SELF_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Force-cancel stale RAGAS 17 and all other active runs
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested") | .id'             > /tmp/active-runs.txt

          while read -r run_id; do
            [ -z "$run_id" ] && continue
            if [ "$run_id" = "$KEEP_RUN_ID" ] || [ "$run_id" = "$SELF_RUN_ID" ]; then
              echo "Keeping $run_id"
              continue
            fi
            echo "Force-cancelling $run_id"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
          done < /tmp/active-runs.txt

          for i in 1 2 3 4 5 6; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STALE_RUN_ID" --jq '.status')
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STALE_RUN_ID" --jq '.conclusion // ""')
            echo "RAGAS 17 status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              exit 0
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$STALE_RUN_ID/force-cancel" >/dev/null 2>&1 || true
            sleep 5
          done

          echo "Force-cancel request submitted repeatedly; GitHub may still be propagating the run-level status."
