name: Cancel all runs except RAGAS 18

on:
  push:
    paths:
      - ".github/workflows/cancel-others.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RUN_ID: "36803926630"
      STALE_RUN_ID: "36803193998"
      SELF_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Clear every active run except RAGAS 18
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested") | .id'             > /tmp/active-runs.txt

          while read -r run_id; do
            [ -z "$run_id" ] && continue
            if [ "$run_id" = "$KEEP_RUN_ID" ] || [ "$run_id" = "$SELF_RUN_ID" ]; then
              echo "Keeping $run_id"
              continue
            fi
            echo "Force-cancelling $run_id"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
          done < /tmp/active-runs.txt

          sleep 3

          stale_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STALE_RUN_ID" --jq '.status' 2>/dev/null || echo "missing")
          echo "RAGAS 17 status after force-cancel: $stale_status"

          if [ "$stale_status" != "completed" ] && [ "$stale_status" != "missing" ]; then
            echo "Deleting stale run record $STALE_RUN_ID to unblock RAGAS 18"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$STALE_RUN_ID" >/dev/null 2>&1 || true
          fi

          echo "Cleanup complete."
