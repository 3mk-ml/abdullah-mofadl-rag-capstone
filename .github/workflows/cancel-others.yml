name: Cancel all runs except RAGAS 19

on:
  push:
    paths:
      - ".github/workflows/cancel-others.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_RUN_ID: "36805001051"
      SELF_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Cancel every active workflow except RAGAS 19
        shell: bash
        run: |
          set -euo pipefail

          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100"             --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested") | .id'             > /tmp/active-runs.txt

          while read -r run_id; do
            [ -z "$run_id" ] && continue
            if [ "$run_id" = "$KEEP_RUN_ID" ] || [ "$run_id" = "$SELF_RUN_ID" ]; then
              echo "Keeping $run_id"
              continue
            fi
            echo "Force-cancelling $run_id"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 ||             gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
          done < /tmp/active-runs.txt
