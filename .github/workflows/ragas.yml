name: Run 20-question RAGAS evaluation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/eval/run_ragas.trigger"

jobs:
  ragas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ~/.cache/huggingface
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require OpenAI API secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing GitHub Actions secret: OPENAI_API_KEY"
            echo "Add it under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download curated corpus
        run: python scripts/download_corpus.py

      - name: Build hybrid retrieval index
        run: python scripts/ingest.py

      - name: Confirm retrieval threshold before RAGAS
        run: |
          python scripts/evaluate_recall.py             --golden data/eval/golden_questions.json             --k 5             --fail-below 0.80

      - name: Run RAGAS on 20 verified questions
        run: |
          python scripts/evaluate_ragas.py             --golden data/eval/golden_questions.json             --out data/eval/ragas_report.csv             --evaluator-model "$OPENAI_MODEL"

      - name: Show RAGAS summary
        run: |
          cat data/eval/ragas_summary.json

      - name: Upload RAGAS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrirag-ragas-report
          path: |
            data/eval/ragas_report.csv
            data/eval/ragas_summary.json
            data/eval/recall_at_5_report.json
          retention-days: 30
