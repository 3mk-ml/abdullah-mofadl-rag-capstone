name: Run 20-question RAGAS evaluation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/eval/run_ragas.trigger"

# A new retry automatically cancels the older slow RAGAS run.
concurrency:
  group: agrirag-ragas-evaluation
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ragas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ~/.cache/huggingface
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: llama-3.1-8b-instant
      RAGAS_MAX_TOKENS: "700"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Groq API secret
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Missing GitHub Actions secret: GROQ_API_KEY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: agrirag-hf-models-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-test RAGAS imports
        run: |
          python - <<'PY'
          import ragas
          from ragas.llms.base import llm_factory
          from ragas.metrics.collections.faithfulness import Faithfulness
          from ragas.metrics.collections.answer_relevancy import AnswerRelevancy
          from ragas.metrics.collections.context_precision import ContextPrecision
          from ragas.metrics.collections.context_recall import ContextRecall
          print("RAGAS import smoke test passed")
          print("ragas:", getattr(ragas, "__version__", "unknown"))
          PY

      # Reuse the exact retrieval index that already passed Recall@5=90%.
      # This avoids re-downloading 20 documents and re-embedding 5,540 chunks
      # on every RAGAS retry.
      - name: Reuse verified retrieval artifact
        uses: actions/download-artifact@v4
        with:
          name: agrirag-corpus-index-evaluation
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36489352097

      - name: Verify reused index and Recall@5 result
        run: |
          test -f data/index/chunks.jsonl
          test -f data/index/bm25.pkl
          test -d data/index/chroma
          test -f data/eval/recall_at_5_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/eval/recall_at_5_report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          recall = float(report["recall"])
          print(f"Verified saved Recall@5: {recall:.2%}")
          if recall < 0.80:
              raise SystemExit("Verified retrieval artifact is below the required threshold")
          PY

      - name: Run RAGAS on 20 verified questions
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/evaluate_ragas.py             --golden data/eval/golden_questions.json             --out data/eval/ragas_report.csv             --checkpoint data/eval/ragas_checkpoint.json             --evaluator-model "$GROQ_MODEL"

      - name: Show RAGAS summary
        run: cat data/eval/ragas_summary.json

      - name: Upload RAGAS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrirag-ragas-report
          path: |
            data/eval/ragas_report.csv
            data/eval/ragas_summary.json
            data/eval/ragas_checkpoint.json
            data/eval/recall_at_5_report.json
          retention-days: 30
