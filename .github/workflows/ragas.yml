name: Run 20-question RAGAS evaluation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/eval/run_ragas.trigger"

jobs:
  ragas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ~/.cache/huggingface
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Gemini API secret
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing GitHub Actions secret: GEMINI_API_KEY"
            echo "Create a Gemini API key in Google AI Studio, add it under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-test RAGAS imports
        run: |
          python - <<'PY'
          import ragas
          import langchain_community
          from ragas.llms.base import llm_factory
          from ragas.metrics.collections.faithfulness import Faithfulness
          from ragas.metrics.collections.answer_relevancy import AnswerRelevancy
          from ragas.metrics.collections.context_precision import ContextPrecision
          from ragas.metrics.collections.context_recall import ContextRecall
          print("RAGAS import smoke test passed")
          print("ragas:", getattr(ragas, "__version__", "unknown"))
          PY

      - name: Download curated corpus
        run: python scripts/download_corpus.py

      - name: Build hybrid retrieval index
        run: python scripts/ingest.py

      - name: Confirm retrieval threshold before RAGAS
        run: |
          python scripts/evaluate_recall.py             --golden data/eval/golden_questions.json             --k 5             --fail-below 0.80

      - name: Run RAGAS on 20 verified questions
        run: |
          python scripts/evaluate_ragas.py             --golden data/eval/golden_questions.json             --out data/eval/ragas_report.csv             --evaluator-model "$GEMINI_MODEL"

      - name: Show RAGAS summary
        run: |
          cat data/eval/ragas_summary.json

      - name: Upload RAGAS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrirag-ragas-report
          path: |
            data/eval/ragas_report.csv
            data/eval/ragas_summary.json
            data/eval/recall_at_5_report.json
          retention-days: 30
