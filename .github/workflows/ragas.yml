name: Run 20-question RAGAS evaluation

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/eval/run_ragas.trigger"

# A new retry automatically cancels the older slow RAGAS run.
concurrency:
  group: agrirag-ragas-evaluation
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  ragas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ~/.cache/huggingface
      LLM_PROVIDER: cohere
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      COHERE_MODEL: command-a-plus-05-2026
      COHERE_BASE_URL: https://api.cohere.ai/compatibility/v1
      RAGAS_EVALUATOR_MODEL: command-a-plus-05-2026
      RAGAS_MAX_TOKENS: "1536"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Cohere API secret
        run: |
          if [ -z "$COHERE_API_KEY" ]; then
            echo "Missing GitHub Actions secret: COHERE_API_KEY"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: agrirag-hf-models-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke-test Cohere model access
        run: |
          python - <<'PY'
          import os
          from openai import OpenAI
          client = OpenAI(
              api_key=os.environ["COHERE_API_KEY"],
              base_url=os.environ["COHERE_BASE_URL"],
              max_retries=2,
          )
          r = client.chat.completions.create(
              model=os.environ["COHERE_MODEL"],
              max_tokens=8,
              messages=[{"role": "user", "content": "Reply with OK."}],
          )
          assert r.choices and r.choices[0].message.content
          print("Cohere model access passed")
          PY

      - name: Smoke-test RAGAS imports
        run: |
          python - <<'PY'
          import ragas
          from ragas.llms.base import llm_factory
          from ragas.metrics.collections.faithfulness import Faithfulness
          from ragas.metrics.collections.answer_relevancy import AnswerRelevancy
          from ragas.metrics.collections.context_precision import ContextPrecision
          from ragas.metrics.collections.context_recall import ContextRecall
          print("RAGAS import smoke test passed")
          print("ragas:", getattr(ragas, "__version__", "unknown"))
          PY

      # Reuse the exact retrieval index that already passed Recall@5=90%.
      # This avoids re-downloading 20 documents and re-embedding 5,540 chunks
      # on every RAGAS retry.
      - name: Reuse verified retrieval artifact
        uses: actions/download-artifact@v4
        with:
          name: agrirag-corpus-index-evaluation
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36489352097

      - name: Verify reused index and Recall@5 result
        run: |
          test -f data/index/chunks.jsonl
          test -f data/index/bm25.pkl
          test -d data/index/chroma
          test -f data/eval/recall_at_5_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/eval/recall_at_5_report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          recall = float(report["recall"])
          print(f"Verified saved Recall@5: {recall:.2%}")
          if recall < 0.80:
              raise SystemExit("Verified retrieval artifact is below the required threshold")
          PY

      - name: Restore previous compatible RAGAS checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/ragas-previous
          ARTIFACT_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=agrirag-ragas-report&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/ragas-previous.zip
            unzip -q -o /tmp/ragas-previous.zip -d /tmp/ragas-previous
            CHECKPOINT=$(find /tmp/ragas-previous -name ragas_checkpoint.json -type f | head -n 1)
            if [ -n "$CHECKPOINT" ]; then
              cp "$CHECKPOINT" data/eval/ragas_checkpoint.json
              echo "Restored prior checkpoint; the evaluator will validate model compatibility."
            else
              echo "No prior checkpoint file found; starting fresh."
            fi
          else
            echo "No prior RAGAS artifact found; starting fresh."
          fi
          set -e

      - name: Run RAGAS on 20 verified questions
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/evaluate_ragas.py             --golden data/eval/golden_questions.json             --out data/eval/ragas_report.csv             --checkpoint data/eval/ragas_checkpoint.json             --evaluator-model "$RAGAS_EVALUATOR_MODEL"

      - name: Show RAGAS summary
        run: cat data/eval/ragas_summary.json

      - name: Upload RAGAS reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agrirag-ragas-report
          path: |
            data/eval/ragas_report.csv
            data/eval/ragas_summary.json
            data/eval/ragas_checkpoint.json
            data/eval/recall_at_5_report.json
          retention-days: 30
