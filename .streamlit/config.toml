[server]
headless = true
address = "0.0.0.0"
port = 7860
fileWatcherType = "none"
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = false
websocketPingInterval = 20

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#226241"
backgroundColor = "#f4f8f3"
secondaryBackgroundColor = "#ffffff"
textColor = "#173126"
font = "sans serif"
